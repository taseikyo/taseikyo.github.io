<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="shortcut icon" href="http://s1.music.126.net/music.ico" />
    <title>୧(๑•̀⌄•́๑)૭✧ 喵喵喵先生电台</title>
    <meta name="keywords" content="网易云音乐，音乐，播放器，网易，下载，播放，DJ，免费，明星，精选，歌单，识别音乐，收藏，分享音乐，音乐互动，高音质，320K，音乐社交，官网，music.163.com">
    <link href="css/default.css" rel="stylesheet">
    <script src="https://cdn.bootcss.com/vue/2.4.4/vue.min.js"></script>
    <script src="https://cdn.bootcss.com/vue-resource/1.3.4/vue-resource.min.js"></script>
</head>
<body>
    <div id="container">
        <h2>୧(๑•̀⌄•́๑)૭✧ 喵喵喵先生电台</h2>
        <div class="card" style="padding: 5px 0px 5px 30px;">
            <h4>最近一次更新: 2018/1/7 by <a href="https://github.com/taseikyo" target="_blank" style="text-decoration: none;color: #c20c0c;">Tich</a>.</h4>
        </div>
        <div id="app">
            <template v-for="item in items">
                <div class="card" :id = "item[12]">
                    <a href="javascript:void(0);" @click="play($event)"><img :src="item[1]" :alt="item[2]"></a>
                    <p><strong>节目: </strong><a class = 'program' @click="jump($event)">{{item[0]}}</a></p>
                    <p class = 'radio'><strong>电台: </strong>{{item[3]}}</p>
                    <p class = 'up'><strong>主播: </strong>{{item[2]}}</p>
                    <div class="count">
                        <p class = 'category'>{{item[5]}}</p>
                        <p class = 'play-count'>播放量: {{item[8]}}</p>
                        <p class = 'like-count'>点赞量: {{item[9]}}</p>
                        <p class = 'cmts-count'>评论量: {{item[10]}}</p>
                        <p class = 'share-count'>分享量: {{item[11]}}</p>
                        <!-- <p class = 'create-time'>{{item[6]}} 创建</p> -->
                    </div>
                    <input type="button" value="播放节目" class="play-btn" @click="play($event)">
                </div>
            </template>
        </div>
        <!-- 翻页 -->
        <div class="card">
            <ul class="pager">
                <li class="previous"><a href="javascript:void(0);" onclick="pages(-1)"> 上一页</a></li>
                <li>
                    <input type="text" style="width: 45px;display: inline-block;" maxlength="2" class="page-num form-control" aria-label="Page Number">
                    <a href="javascript:void(0);" onclick="pages(document.querySelector('.page-num').value)">跳页</a>
                </li>
                <li class="next"><a href="javascript:void(0);" onclick="pages(-2)">下一页 </a></li>
            </ul>
        </div>
    </div>
    <iframe id="player" frameborder="no" border="0" marginwidth="0" marginheight="0" width=330 height=86 src="//music.163.com/outchain/player?type=3&id=795437823&auto=0&height=66"></iframe>
</body>
<script>
    path = window.location.href
    pattern = /[1-9][0-9]*/g
    page = path.match(pattern)
    if (!page || parseInt(page) < 1) {
        page = 1
    }
    var app = new Vue({
        el: "#app",
        data: {
            //声明空数组，进行数据接收，最后传递到前端页面
            items: [],
        },
        //向data数组里添加数据
        mounted: function() {
            this.getData();
        },
        methods: {
            getData: function() {
                this.$http.get("https://taseikyo.github.io/radio/json/" + page + ".json").then(function(res) {
                    // console.log(res);
                    for (var i = 0, len = res.body.length; i < len; i++) {
                        //获取每个元素
                        var card = res.body[i];
                        // console.log(card);
                        //将获取的数据push到空的数组中itenList，
                        this.items.push(card);
                    }
                })
            },
            play: function(e) {  
                // e.currentTarget.parentNode.id; //节目的id
                var url = '//music.163.com/outchain/player?type=3&id='+ e.currentTarget.parentNode.id +'&auto=0&height=66'
                var iframe = document.getElementById('player')
                iframe.src = url
                // console.log(iframe.src);// 当前元素 
            },
            jump: function(e) {
                var url = '//music.163.com/#/program?id='+ e.currentTarget.parentNode.parentNode.id
                window.location.href = url;
            }

        }
    });

    function pages(num){
        path = window.location.href;
        pattern = /[1-9][0-9]*/g;
        // // alert(path);
        path = path.match(pattern);
        // console.log(parseInt(path));
        if (num == -1) {//上一页
            if (!path){
                return;
            }
            if (parseInt(path) == 2){
                window.location.href="https://taseikyo.github.io/blog/radio/";
            }
            else{
                path = (window.location.href).replace(/[1-9][0-9]*/g, parseInt(path)-1); 
                window.location.href = path;
            }
            // window.location.href="你所要跳转的页面";
        }
        else if(num == -2){//下一页
            if (!path){
                window.location.href="https://taseikyo.github.io/blog/radio/?2";
            }
            else if(parseInt(path) == 15){
                return;
            }
            else{
                path = (window.location.href).replace(/[1-9][0-9]*/g, parseInt(path)+1);
                window.location.href = path;
            }
        }
        else{//跳到指定页
            if (num == 1) {
                window.location.href="https://taseikyo.github.io/radio";
            }
            else{
                window.location.href = "https://taseikyo.github.io/blog/radio/?"+num;
            }
        }
    }
</script>
</html>
