<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>HUST-Rank</title>
    <script src="https://cdn.bootcss.com/echarts/3.7.2/echarts.min.js"></script>
    <link href="../RAM-JD/css/bootstrap.min.css" rel="stylesheet">
    <link href="../RAM-JD/css/non-responsive.css" rel="stylesheet">
    <link href="https://netdna.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <style>
        #main{
            width: 960px;
            text-align: center;
            margin: 0px auto;
        }
        .chart{
            width: 800px;
            height:400px;
            margin: 0px auto;
        }
        iframe{
            margin-top: 10px;
            float: right;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-default navbar-fixed-top">
      <div class="container">
        <div class="navbar-header">
          <a class="navbar-brand" href="https://github.com/LewisTian/HUST" target="_blank">HUST-Rank</a>
        </div>
        <!-- Note that the .navbar-collapse and .collapse classes have been removed from the #navbar -->
        <div id="navbar">
          <ul class="nav navbar-nav">
            <li><a href="https://lewistian.github.io/">Home</a></li>
            <li><a href="https://github.com/LewisTian/HUST" target="_blank">About</a></li>
            <li><a href="Mailto:2471740600@qq.com">Contact</a></li>
          </ul>
          <ul class="nav navbar-nav navbar-right">
            <form class="navbar-form navbar-left">
                <iframe src="https://ghbtns.com/github-btn.html?user=LewisTian&repo=HUST&type=star&count=true&size=large" frameborder="0" scrolling="0" width="150px" height="50px"></iframe>
                <iframe src="https://ghbtns.com/github-btn.html?user=LewisTian&repo=HUST&type=fork&count=true&size=large" frameborder="0" scrolling="0" width="150px" height="50px" ></iframe>
          </ul>
        </div><!--/.nav-collapse -->
      </div>
    </nav>
    <div id="main">
        <div><h1>华中科技大学贴吧牛人榜数据分析（10级计以上）</h1></div>
        <hr >
        <div id="rank_title"><h2>各等级比例</h2></div>
        <div id="rank"  class="chart"></div>
        <div id="sex_title"><h2>性别比例</h2></div>
        <div id="sex"  class="chart"></div>
        <div id="post_title"><h2>发帖量比例</h2></div>
        <div id="post"  class="chart"></div>
        <div id="age_title"><h2>吧龄比例</h2></div>
        <div id="age"  class="chart"></div>
    </div>
</body>
<script type="text/javascript">
    var rank = echarts.init(document.getElementById('rank'));
    var sex = echarts.init(document.getElementById('sex'));
    var post = echarts.init(document.getElementById('post'));
    var age = echarts.init(document.getElementById('age'));
    var o1 = {
        tooltip: {
            trigger: 'item',
            formatter: "{a} <br/>{b}: {c} ({d}%)"
        },
        toolbox: {
            show : true,
            feature : {
                mark : {show: true},
                dataView : {show: true, readOnly: false},
                magicType : {
                    show: true,
                    type: ['pie', 'funnel']
                },
                restore : {show: true},
                saveAsImage : {show: true}
            }
        },
        legend: {
            orient: 'vertical',
            x: 'left',
            data:['15级','14级','13级','12级','11级','10级']
        },
        series: [
            {
                name:'人数',
                type:'pie',
                radius: ['55%', '80%'],
                avoidLabelOverlap: false,
                label: {
                    normal: {
                        show: false,
                        position: 'center'
                    },
                    emphasis: {
                        show: true,
                        textStyle: {
                            fontSize: '30',
                            fontWeight: 'bold'
                        }
                    }
                },
                labelLine: {
                    normal: {
                        show: false
                    }
                },
                data:[
                    {value:19,name:'15级'},
                    {value:107,name:'14级'},
                    {value:737,name:'13级'},
                    {value:2692,name:'12级'},
                    {value:6854,name:'11级'},
                    {value:4980,name:'10级'}
                ]
            }
        ]
    };

    var o2 = {
        tooltip: {
            trigger: 'axis',
            axisPointer: {
                type: 'shadow'
            }
        },
        toolbox: {
            show : true,
            feature : {
                mark : {show: true},
                dataView : {show: true, readOnly: false},
                magicType : {
                    show: true,
                    type: ['pie', 'funnel']
                },
                restore : {show: true},
                saveAsImage : {show: true}
            }
        },
        grid: {
            left: '3%',
            right: '4%',
            bottom: '3%',
            containLabel: true
        },
        xAxis: {
            type: 'value',
            boundaryGap: [0, 0.01]
        },
        yAxis: {
            type: 'category',
            data: ['female', 'male', 'unknown']
        },
        series: [
            {
                name: '数量',
                type: 'bar',
                data: [3035, 11718, 647]
            }
        ]
    };

    var o3 = {
        tooltip : {
            trigger: 'item',
            formatter: "{a} <br/>{b} : {c} ({d}%)"
        },
        legend: {
            x : 'center',
            y : 'bottom',
            data:['>=10万','5~10万(含5万)','1~5万(含1万)','<1万','unknown']
        },
        toolbox: {
            show : true,
            feature : {
                mark : {show: true},
                dataView : {show: true, readOnly: false},
                magicType : {
                    show: true,
                    type: ['pie', 'funnel']
                },
                restore : {show: true},
                saveAsImage : {show: true}
            }
        },
        calculable : true,
        series : [
            {
                name:'人数',
                type:'pie',
                radius : [60, 130],
                center : ['50%', '50%'],
                roseType : 'radius',
                label: {
                    normal: {
                        show: false
                    },
                    emphasis: {
                        show: true
                    }
                },
                lableLine: {
                    normal: {
                        show: false
                    },
                    emphasis: {
                        show: true
                    }
                },
                data:[
                    {value:171, name:'>=10万'},
                    {value:254, name:'5~10万(含5万)'},
                    {value:2222, name:'1~5万(含1万)'},
                    {value:12106, name:'<1万'},
                    {value:647, name:'unknown'}
                ]
            }
        ]
    };

    var o4 = {
        toolbox: {
            show : true,
            feature : {
                mark : {show: true},
                dataView : {show: true, readOnly: false},
                magicType : {
                    show: true,
                    type: ['pie', 'funnel']
                },
                restore : {show: true},
                saveAsImage : {show: true}
            }
        },
        tooltip: {
            trigger: 'axis'
        },
        legend: {
            x: 'center',
            data:['>=10万','5~10万(含5万)','1~5万(含1万)','<1万','unknown']
        },
        radar: [
            {
                indicator: [
                   {max:400, name:'>=10万'},
                    {max:7000, name:'5~10万(含5万)'},
                    {max:8000, name:'1~5万(含1万)'},
                    {max:10, name:'<1万'},
                    {max:700, name:'unknown'}
                ],
                center: ['50%','50%'],
                radius: 160
            }
        ],
        series: [
            {
                type: 'radar',
                 tooltip: {
                    trigger: 'item'
                },
                itemStyle: {normal: {areaStyle: {type: 'default'}}},
                data: [
                    {
                        value : [350, 6682, 7721, 0, 647],
                        name: '人数'
                    }
                ]
            }
        ]
    };
    rank.setOption(o1);
    sex.setOption(o2);
    post.setOption(o3);
    age.setOption(o4);
</script>
</html>
